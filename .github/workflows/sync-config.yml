name: Sync config.json to volume
on:
  workflow_dispatch:

# WARNING: this OVERWRITES /data/config.json with the repo copy. The live file
# can drift from the repo (updateUserPin writes PIN changes to the volume), so
# syncing resets any PINs users changed via the admin panel. This goes away in
# refactor Phase 4 when users move out of config.json entirely.

jobs:
  sync-config:
    name: Sync config.json
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Upload config.json to /data
        # sftp put refuses to overwrite an existing file (and the pipe swallows
        # its error), so remove the old file first and verify the upload took.
        run: |
          flyctl ssh console -C "rm -f /data/config.json"
          echo "put config.json /data/config.json" | flyctl sftp shell
          flyctl ssh console -C "cat /data/config.json" | diff config.json - \
            || (echo "::error::config.json on volume does not match repo after upload" && exit 1)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Restart machines so the new config takes effect
        run: |
          flyctl machine list --json | jq -r '.[].id' | while read -r id; do
            flyctl machine restart "$id"
          done
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
